name: musllinux wheels (stefano-ntgcalls)

on:
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: 'Rebuild the musl Clang build image (slow, needed on first run)'
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/sanji78/stefano-ntgcalls

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_image
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Clang.muslinux.${{ matrix.arch.name }}.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/muslinux-${{ matrix.arch.name }}:latest

  wheels:
    needs: image
    if: always() && (needs.image.result == 'success' || needs.image.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    container:
      image: ghcr.io/sanji78/stefano-ntgcalls/muslinux-${{ matrix.arch.name }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Git safe directory
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build wheels (cp313, cp314)
        shell: bash
        env:
          PYPI_TAGS: '1'
        run: |
          set -euxo pipefail
          for PY in cp313-cp313 cp314-cp314; do
            PYBIN=/opt/python/$PY/bin/python
            $PYBIN -m pip install -U pip setuptools wheel cmake ninja auditwheel
            export PATH="$(dirname $PYBIN):$PATH"
            $PYBIN -m pip wheel . --no-build-isolation --no-deps -v -w dist_raw
            $PYBIN -m auditwheel repair dist_raw/*-$PY-*.whl -w wheelhouse
            rm -rf build
          done
          ls -l wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
        py: ['3.13', '3.14']
    runs-on: ${{ matrix.arch.runner }}
    container: python:${{ matrix.py }}-alpine
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.arch.name }}
          path: wheelhouse
      - name: Install and import on Alpine (like Home Assistant)
        run: |
          pip install --no-index --find-links wheelhouse stefano-ntgcalls
          python -c "import ntgcalls; print('ntgcalls OK', getattr(ntgcalls, '__version__', ''))"

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
